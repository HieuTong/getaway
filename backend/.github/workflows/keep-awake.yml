name: Keep agent server awake

on:
  schedule:
    # Every 10 minutes from 8:00 to 20:59 Melbourne time (AEDT, UTC+11).
    # Cron runs in UTC: 21:00-23:59 and 00:00-09:59 UTC.
    - cron: "*/10 21-23,0-9 * * *"
  workflow_dispatch: # also allows running it manually from GitHub or the gh CLI

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the health endpoint
        # /health calls no paid APIs, so these pings cost nothing in Gemini or Maps usage.
        run: curl --fail --silent --show-error --max-time 120 "${{ vars.AGENT_BASE_URL }}/health"
