name: Getaway
options:
  bundleIdPrefix: com.hieutong
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

# Build settings from these files apply to every target (this is how the API key gets in).
configFiles:
  Debug: Secrets.xcconfig
  Release: Secrets.xcconfig

packages:
  GoogleMaps:
    url: https://github.com/googlemaps/ios-maps-sdk
    exactVersion: 11.2.0
  GooglePlaces:
    url: https://github.com/googlemaps/ios-places-sdk
    exactVersion: 11.3.0

targets:
  Getaway:
    type: application
    platform: iOS
    sources:
      - Getaway
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hieutong.getaway
        INFOPLIST_FILE: Getaway/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: GoogleMaps
        product: GoogleMaps
      - package: GooglePlaces
        product: GooglePlacesSwift
